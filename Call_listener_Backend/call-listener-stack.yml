# Backend + its own Redis behind an existing Traefik (Docker provider,
# external network `edge-net`, entrypoint `websecure`, ACME resolver `le`).
#
# Run from this directory with the secrets/config file kept outside the
# checkout (see scripts/deploy/README.md):
#   CALLER_DOMAIN=caller.example.com CALLER_ENV_FILE=/path/to/caller.env \
#     docker compose -f call-listener-stack.yml --env-file /path/to/caller.env -p call-listener up -d --build
services:
  redis:
    image: redis:7-alpine
    container_name: call-redis
    restart: unless-stopped
    # appendonly: revocations and enrollments have no expiry and must survive
    # restarts. noeviction: never drop them under memory pressure; writes
    # fail loudly instead.
    command:
      - sh
      - -c
      - exec redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 2s
      retries: 20
    volumes:
      - redis-data:/data
    networks:
      - callnet
    mem_limit: 320m

  backend:
    build: .
    image: call-listener-backend:latest
    container_name: call-backend
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - ${CALLER_ENV_FILE:?CALLER_ENV_FILE is required}
    environment:
      NODE_ENV: production
      REDIS_URL: redis://default:${REDIS_PASSWORD}@redis:6379
      PORT: "4000"          # WebSocket server inside the container
      EXPRESS_PORT: "3000"  # HTTP API inside the container
      TRUST_PROXY_HOPS: "1" # Traefik is the single trusted proxy hop
      COOKIE_DOMAIN: ${CALLER_DOMAIN:?CALLER_DOMAIN is required}
      COOKIE_SECURE: "true"
      LOG_TO_FILE: "0"      # stdout only; `docker logs call-backend`
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 15s
    expose:
      - "3000"
      - "4000"
    networks:
      - callnet  # its own Redis
      - edge-net # reachable by Traefik
    mem_limit: 768m
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=edge-net"

      # API (Express on 3000)
      - "traefik.http.routers.call-api.rule=Host(`${CALLER_DOMAIN}`)"
      - "traefik.http.routers.call-api.entrypoints=websecure"
      - "traefik.http.routers.call-api.tls=true"
      - "traefik.http.routers.call-api.tls.certresolver=le"
      - "traefik.http.routers.call-api.service=call-api-svc"
      - "traefik.http.services.call-api-svc.loadbalancer.server.port=3000"

      # WebSocket (4000) on /ws and /ws/... only. Not a bare PathPrefix(`/ws`):
      # that would also route Express's POST /ws-ticket here.
      - "traefik.http.routers.call-ws.rule=Host(`${CALLER_DOMAIN}`) && (Path(`/ws`) || PathPrefix(`/ws/`))"
      - "traefik.http.routers.call-ws.entrypoints=websecure"
      - "traefik.http.routers.call-ws.tls=true"
      - "traefik.http.routers.call-ws.tls.certresolver=le"
      - "traefik.http.routers.call-ws.service=call-ws-svc"
      - "traefik.http.services.call-ws-svc.loadbalancer.server.port=4000"

      # Security headers and a coarse per-IP rate limit in front of the
      # application's own limits.
      - "traefik.http.middlewares.call-sec.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.call-sec.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.call-sec.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.call-sec.headers.referrerPolicy=no-referrer"
      - "traefik.http.middlewares.call-sec.headers.frameDeny=true"
      - "traefik.http.middlewares.call-rl.ratelimit.average=50"
      - "traefik.http.middlewares.call-rl.ratelimit.burst=100"
      - "traefik.http.routers.call-api.middlewares=call-sec@docker,call-rl@docker"
      - "traefik.http.routers.call-ws.middlewares=call-sec@docker,call-rl@docker"

volumes:
  redis-data:

networks:
  callnet:
  edge-net:
    external: true
